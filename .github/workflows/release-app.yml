name: Release App

# Publishes the macOS Pier host app to GitHub Releases Latest for electron-updater.
# Plugin releases must stay prerelease (--latest=false) so they never own /releases/latest.
# After Latest is verified, calls Publish Release to Blog. Do not rely on on.release:
# this workflow creates the GitHub Release with GITHUB_TOKEN, which does not start
# other workflows (GitHub recursive-run guard).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag including v prefix (e.g. v0.2.0). Must match package.json version.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          case "$RAW_TAG" in
            v*) VERSION="${RAW_TAG#v}" ;;
            *)
              echo "tag must look like vX.Y.Z, got: $RAW_TAG" >&2
              exit 1
              ;;
          esac
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved app release tag=$RAW_TAG version=$VERSION"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.version.outputs.tag }}

      - name: Select the pinned Xcode 26.6 toolchain
        run: |
          set -euo pipefail
          test -z "${DEVELOPER_DIR:-}"
          readonly pier_xcode_dir=/Applications/Xcode_26.6.app/Contents/Developer
          test -d "$pier_xcode_dir"
          sudo xcode-select --switch "$pier_xcode_dir"
          test "$(xcode-select --print-path)" = "$pier_xcode_dir"
          xcodebuild -version
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"
          xcrun --find actool

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package.json version matches tag
        run: node ./scripts/verify-app-release-version.mjs "${{ steps.version.outputs.version }}"

      # GhosttyKit is not in git; build:dist requires the xcframework (same as Quality Gate native).
      - id: ghostty-kit-cache
        uses: actions/cache@v4
        with:
          key: ghostty-kit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-libghostty.sh', 'native/Vendor/libghostty-spm/Patches/ghostty/**') }}
          path: native/Vendor/libghostty-spm/GhosttyKit.xcframework
      - if: steps.ghostty-kit-cache.outputs.cache-hit != 'true'
        run: brew install zig@0.15
      - if: steps.ghostty-kit-cache.outputs.cache-hit != 'true'
        run: xcrun -sdk macosx metal -v || xcodebuild -downloadComponent MetalToolchain
      - if: steps.ghostty-kit-cache.outputs.cache-hit != 'true'
        run: pnpm build:libghostty

      # @electron/notarize expects APPLE_API_KEY to be a *path* to the .p8 file,
      # not the PEM body. Materialize the secret on the runner before build:dist.
      - name: Materialize App Store Connect API key
        env:
          APPLE_API_KEY_BODY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_BODY:-}" ]; then
            echo "APPLE_API_KEY secret empty; skip materialize (keychain profile / Apple ID path may still work)"
            exit 0
          fi
          KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          # Preserve PEM newlines from the secret body.
          printf '%s\n' "$APPLE_API_KEY_BODY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          {
            echo "APPLE_API_KEY=${KEY_PATH}"
          } >> "$GITHUB_ENV"
          echo "Wrote App Store Connect API key to ${KEY_PATH}"

      - name: Build, sign, notarize, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          # APPLE_API_KEY path is set by the previous step via GITHUB_ENV when present.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
          # build-dist.sh blocks CSC_LINK publish unless explicitly allowed.
          PIER_DIST_ALLOW_CSC_LINK_PUBLISH: "1"
        run: pnpm build:dist --publish=always

      - name: Verify dual-arch mac artifacts exist locally
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ls -lh dist-builder/latest-mac.yml dist-builder/*.zip dist-builder/*.dmg
          node ./scripts/verify-mac-release-artifacts.mjs \
            --dir dist-builder \
            --version "$VERSION"

      - name: Verify GitHub Latest is host channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Hard gate: /releases/latest must be this host version with latest-mac.yml.
          # Plugin prereleases must never own Latest (electron-updater reads only Latest).
          node ./scripts/verify-github-latest-isolation.mjs \
            --expect-version "${{ steps.version.outputs.version }}"

  publish-blog:
    needs: release
    uses: ./.github/workflows/release-to-blog.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
