name: Update model pricing

# 每天 UTC 03:00 自动跑，跟 LiteLLM / OpenRouter 同步。也可以手动触发。
# 仅当 pricing-catalog.json 有 diff 时才跑护栏测试并开/更新 PR；
# 无变化则 Detect changes → changed=false，后续 step 全部跳过（不 commit、不开 PR）。
#
# pull_request：对定价相关改动跑同一套护栏（不抓上游、不开 PR），避免
# 写死单价的测试在刷新后才炸、而日常 PR 漏检。
#
# PR 创建权限：
# - 工作流已声明 contents/pull-requests: write。
# - 若组织关闭了「Allow GitHub Actions to create and approve pull requests」
#   或 default_workflow_permissions=read 且禁止提权，GITHUB_TOKEN 无法开 PR。
# - 可选：在仓库 secrets 配置 `PRICING_BOT_TOKEN`（classic PAT：repo 权限，
#   或 fine-grained：Contents R/W + Pull requests R/W），workflow 会优先使用。
# - 若仍无法开 PR：分支仍会 push 到 `chore/pricing-refresh`，本地可
#   `gh pr create --base main --head chore/pricing-refresh`。
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/update-model-pricing.yml"
      - "scripts/update-model-pricing.mjs"
      - "src/main/services/usage-data/pricing-catalog.json"
      - "src/main/services/usage-data/pricing.ts"
      - "tests/unit/main/pricing-catalog-schema.test.ts"
      - "tests/unit/main/pricing-catalog.test.ts"
      - "tests/unit/main/update-model-pricing.test.ts"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-model-pricing-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'refresh' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fetch and normalize LiteLLM pricing
        if: github.event_name != 'pull_request'
        run: node scripts/update-model-pricing.mjs --diff-out=pricing-diff.md

      - name: Detect changes
        if: github.event_name != 'pull_request'
        id: diff
        run: |
          if git diff --quiet src/main/services/usage-data/pricing-catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog changes; skipping tests and PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Catalog changed; will run guardrails and open/update PR."
            git --no-pager diff --stat src/main/services/usage-data/pricing-catalog.json
          fi

      - name: Install dependencies
        if: >-
          github.event_name == 'pull_request' ||
          steps.diff.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Guardrail — schema tests
        if: >-
          github.event_name == 'pull_request' ||
          steps.diff.outputs.changed == 'true'
        run: pnpm exec vitest run tests/unit/main/pricing-catalog-schema.test.ts tests/unit/main/pricing-catalog.test.ts tests/unit/main/update-model-pricing.test.ts --run

      - name: Upload pricing diff
        if: >-
          github.event_name != 'pull_request' &&
          steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pricing-diff
          path: pricing-diff.md
          if-no-files-found: ignore

      - name: Open PR
        id: cpr
        if: >-
          github.event_name != 'pull_request' &&
          steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        continue-on-error: true
        with:
          # Prefer a bot PAT when org forbids GITHUB_TOKEN PR creation.
          token: ${{ secrets.PRICING_BOT_TOKEN || github.token }}
          commit-message: "chore(pricing): daily LiteLLM refresh"
          title: "chore(pricing): daily LiteLLM refresh"
          body-path: pricing-diff.md
          branch: chore/pricing-refresh
          delete-branch: true
          add-paths: |
            src/main/services/usage-data/pricing-catalog.json
          labels: |
            chore
            pricing

      - name: Report PR outcome
        if: >-
          github.event_name != 'pull_request' &&
          steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRICING_BOT_TOKEN || github.token }}
          CPR_OUTCOME: ${{ steps.cpr.outcome }}
          CPR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          CPR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          set -euo pipefail
          if [ "$CPR_OUTCOME" = "success" ] && [ -n "${CPR_NUMBER:-}" ]; then
            echo "Opened/updated PR #$CPR_NUMBER: $CPR_URL"
            exit 0
          fi

          echo "::warning::create-pull-request did not open a PR (outcome=$CPR_OUTCOME)."
          echo "Common cause: org disables GitHub Actions PR creation, or GITHUB_TOKEN lacks pull-requests write."
          echo "Branch should still exist as chore/pricing-refresh if push succeeded."
          echo "Fix options:"
          echo "  1) Org/repo: enable 'Allow GitHub Actions to create and approve pull requests'"
          echo "  2) Add secret PRICING_BOT_TOKEN (PAT with repo + pull_request scopes)"
          echo "  3) Manually: gh pr create --base main --head chore/pricing-refresh --body-file pricing-diff.md"

          # Last-chance: try gh with the same token (helps when CPR failed for other reasons).
          if git ls-remote --exit-code origin refs/heads/chore/pricing-refresh >/dev/null 2>&1; then
            if gh pr list --head chore/pricing-refresh --state open --json number --jq 'length' | grep -qx '0'; then
              if gh pr create \
                --base main \
                --head chore/pricing-refresh \
                --title "chore(pricing): daily LiteLLM refresh" \
                --body-file pricing-diff.md; then
                echo "Opened PR via gh fallback."
                exit 0
              fi
            else
              echo "An open PR for chore/pricing-refresh already exists."
              gh pr list --head chore/pricing-refresh --state open
              exit 0
            fi
          else
            echo "::error::Branch chore/pricing-refresh was not found on origin; push may have failed."
          fi

          # Surface as job failure so the schedule still alerts maintainers.
          exit 1
