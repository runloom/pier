name: Regenerate minimal icon assets

on:
  push:
    branches:
      - design/minimal-docked-terminal-icon
    paths:
      - build/app-icon-master.svg
      - build/app-icon-rounded.svg
      - build/app-icon-micro.svg
      - scripts/build-app-icons.mjs
      - .github/workflows/regenerate-minimal-icon.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/minimal-docked-terminal-icon
      - name: Install icon toolchain
        run: brew install librsvg imagemagick
      - name: Regenerate tracked icon outputs
        run: node scripts/build-app-icons.mjs
      - name: Commit generated assets
        run: |
          if git diff --quiet -- build/icon.icns build/icon.ico build/icon.png; then
            echo "Generated assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/icon.icns build/icon.ico build/icon.png
          git commit -m "build(icon): regenerate minimal icon assets"
          git push origin HEAD:design/minimal-docked-terminal-icon
