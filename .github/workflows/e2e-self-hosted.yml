# 在闲置 Mac 的 self-hosted runner 上跑 Pier e2e（不占用主力机）。
# 前提：笔记本已执行 scripts/e2e-runner/setup-mac.sh + install-actions-runner.sh
# labels: self-hosted, macOS, pier-e2e
#
# 触发：Actions → E2E Self-Hosted → Run workflow
# 或: gh workflow run e2e-self-hosted.yml -f suite=smoke
name: E2E Self-Hosted

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "e2e 范围"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
          - custom
      custom_path:
        description: "suite=custom 时的 playwright 路径（单路径，勿含 shell 元字符）"
        required: false
        default: "tests/e2e/startup-stability.spec.ts"
        type: string
      ref_note:
        description: "可选备注（仅日志）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-self-hosted
  # 单机 runner：取消中途 job 易留下 Electron 僵尸；默认不抢杀
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: [self-hosted, macOS, pier-e2e]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # self-hosted 机通常已有 node/pnpm；仍 setup 以保证 job 自包含
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Toolchain snapshot
        run: |
          echo "note=${{ inputs.ref_note }}"
          uname -a
          echo "PATH=$PATH"
          node --version
          pnpm --version
          zig version || true
          xcode-select -p
          which node pnpm

      - name: Install / link workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm setup:worktree

      - name: Build electron
        run: pnpm build:electron

      - name: Pack plugins (pretest:e2e)
        run: pnpm plugins:pack

      - name: Run e2e
        env:
          PIER_TEST_DISABLE_QUIT_CONFIRMATION: "1"
        run: |
          set -euo pipefail
          suite="${{ inputs.suite }}"
          case "$suite" in
            smoke)
              pnpm exec playwright test --config playwright.config.ts \
                tests/e2e/startup-stability.spec.ts
              ;;
            full)
              pnpm test:e2e
              ;;
            custom)
              path="${{ inputs.custom_path }}"
              if [ -z "$path" ]; then
                echo "custom suite requires custom_path" >&2
                exit 1
              fi
              # 单路径参数，禁止空白注入多 arg
              case "$path" in
                *[[:space:]]*|*\;*|*\|*|*\&*|*\$*|*\`*)
                  echo "custom_path contains forbidden characters: $path" >&2
                  exit 1
                  ;;
              esac
              pnpm exec playwright test --config playwright.config.ts "$path"
              ;;
            *)
              echo "unknown suite: $suite" >&2
              exit 1
              ;;
          esac

      - name: Cleanup leftover Electron (best-effort)
        if: always()
        run: |
          set +e
          # 勿杀系统无关进程；仅清 Playwright/e2e 常见残留
          pkill -f "out/main/index.js" 2>/dev/null || true
          pkill -f "Electron.*pier" 2>/dev/null || true
          true

      - name: Upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-self-hosted
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
