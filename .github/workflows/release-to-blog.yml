name: Publish Release to Blog

# 官网博客必须由 Release App 成功后 workflow_call（或手动 workflow_dispatch）触发。
# 不要用 on.release：Release App 以 GITHUB_TOKEN 创建 GitHub Release，
# GitHub 的递归保护不会让该 token 再触发其它 workflow，v0.1.33 因此漏发。

on:
  workflow_call:
    inputs:
      tag:
        description: "版本标签（如 v0.1.33）"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "版本标签（如 v0.1.33）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 解析版本标签
        id: version
        run: |
          set -euo pipefail
          RAW="${{ inputs.tag }}"
          RAW="${RAW#v}"
          if [[ ! "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::宿主版本标签必须是 vX.Y.Z，收到：${{ inputs.tag }}"
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW" >> "$GITHUB_OUTPUT"

      - name: Checkout pier
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: 生成博客文章
        id: generate
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python3 .github/scripts/release-to-blog.py \
            --changelog CHANGELOG.md \
            --version "${{ steps.version.outputs.tag }}" \
            --out /tmp/blog-posts
          echo "slug=$(cat /tmp/blog-posts/slug 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: 无对应条目则跳过
        if: steps.generate.outputs.slug == ''
        run: echo "CHANGELOG 中无对应条目，本次发布不生成博客文章"

      - name: 写入 pier-website main
        if: steps.generate.outputs.slug != ''
        env:
          BLOG_PAT: ${{ secrets.BLOG_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$BLOG_PAT" ]; then
            echo "::error::缺少 secrets.BLOG_PAT：请创建对 runloom/pier-website 有 contents:write 的 PAT，并配置到本仓库 Secrets"
            exit 1
          fi
          SLUG="${{ steps.generate.outputs.slug }}"
          git clone --depth 1 "https://x-access-token:${BLOG_PAT}@github.com/runloom/pier-website.git" /tmp/pier-site
          cd /tmp/pier-site
          if [ -f "src/content/blog/zh/${SLUG}.md" ]; then
            echo "已有 src/content/blog/zh/${SLUG}.md，跳过"
            exit 0
          fi
          mkdir -p src/content/blog/zh src/content/blog/en src/content/blog/ja src/content/blog/ko
          cp /tmp/blog-posts/zh/*.md src/content/blog/zh/
          for lang in en ja ko; do
            if ls /tmp/blog-posts/"$lang"/*.md >/dev/null 2>&1; then
              cp /tmp/blog-posts/"$lang"/*.md src/content/blog/"$lang"/
            fi
          done
          git config user.name "pier-release-bot"
          git config user.email "pier-release-bot@users.noreply.github.com"
          git add src/content/blog
          if git diff --cached --quiet; then
            echo "无变更，跳过"
            exit 0
          fi
          git commit -m "blog: 发布 Pier ${SLUG} 更新文章"
          git push origin HEAD:main
          echo "已推送到 runloom/pier-website@main，Pages 将自动部署"
