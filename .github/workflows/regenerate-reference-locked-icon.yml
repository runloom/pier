name: Regenerate reference-locked app icon

on:
  push:
    branches:
      - design/icon-03-reference-locked
    paths:
      - build/app-icon-master.svg
      - build/app-icon-rounded.svg
      - build/app-icon-micro.svg
      - scripts/build-app-icons.mjs
      - .github/workflows/regenerate-reference-locked-icon.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/icon-03-reference-locked
          fetch-depth: 0

      - name: Install icon build dependencies
        run: brew install librsvg imagemagick

      - name: Generate production icon assets
        run: node ./scripts/build-app-icons.mjs

      - name: Verify generated containers
        run: |
          set -euo pipefail
          file build/icon.png build/icon.ico build/icon.icns
          sips -g pixelWidth -g pixelHeight build/icon.png
          test "$(sips -g pixelWidth build/icon.png | awk '/pixelWidth/{print $2}')" = "512"
          test "$(sips -g pixelHeight build/icon.png | awk '/pixelHeight/{print $2}')" = "512"

      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/icon.png build/icon.ico build/icon.icns
          if git diff --cached --quiet; then
            echo "Generated assets already current"
            exit 0
          fi
          git commit -m "build(icon): regenerate reference-locked production assets"
          git push origin HEAD:design/icon-03-reference-locked
