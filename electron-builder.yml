appId: io.pier.app
productName: Pier
copyright: Copyright © 2026 Pier

directories:
  output: dist-builder
  buildResources: build

# Native terminal runtime:
# - terminal.ts 用 require("../../native/build/Release/ghostty_native.node")
# - terminal-native-addon.ts 把 GHOSTTY_RESOURCES_DIR 指向
#   native/GhosttyResources/ghostty
# 必须把 .node/.dylib 和 Ghostty resources 都打进包，且 asarUnpack 保留物理路径。
files:
  - out/**/*
  - '!**/*.map'
  - native/build/Release/**
  - native/GhosttyResources/**

extraResources:
  - from: bin/pier.mjs
    to: bin/pier
  - from: resources/fonts
    to: fonts
  - from: resources/notification-sounds
    to: notification-sounds
  - from: resources/system-skills
    to: system-skills
    filter:
      - "**/*"
  # Content search runtime (rg). Layout: search/<arch>/rg
  - from: resources/search
    to: search
    filter:
      - "**/*"
      - "!README.md"
  - from: packages/plugin-codex/dist-pkg
    to: plugin-packages/pier.codex
    filter:
      - '*.tgz'
      - '*.tgz.sha256'
      - 'plugin.json'
  - from: packages/plugin-grok/dist-pkg
    to: plugin-packages/pier.grok
    filter:
      - '*.tgz'
      - '*.tgz.sha256'
      - 'plugin.json'
  - from: packages/plugin-ssh/dist-pkg
    to: plugin-packages/pier.ssh
    filter:
      - '*.tgz'
      - '*.tgz.sha256'
      - 'plugin.json'
  - from: packages/plugin-claude/dist-pkg
    to: plugin-packages/pier.claude
    filter:
      - '*.tgz'
      - '*.tgz.sha256'
      - 'plugin.json'
  - from: packages/plugin-lsp-zig/dist-pkg
    to: plugin-packages/pier.lsp-zig
    filter:
      - '*.tgz'
      - '*.tgz.sha256'
      - 'plugin.json'
  - from: packages/plugin-lsp-java/dist-pkg
    to: plugin-packages/pier.lsp-java
    filter:
      - '*.tgz'
      - '*.tgz.sha256'
      - 'plugin.json'
  - from: packages/plugin-lsp-cpp/dist-pkg
    to: plugin-packages/pier.lsp-cpp
    filter:
      - '*.tgz'
      - '*.tgz.sha256'
      - 'plugin.json'
  - from: packages/plugin-lsp-csharp/dist-pkg
    to: plugin-packages/pier.lsp-csharp
    filter:
      - '*.tgz'
      - '*.tgz.sha256'
      - 'plugin.json'

asar: true
asarUnpack:
  - native/build/Release/**
  - native/GhosttyResources/**
  # 画布编译走 esbuild，它 spawn 一个原生二进制。asar 是单个文件，spawn 会
  # ENOTDIR；main 侧 ensureEsbuildBinaryPath() 把路径改写到这里的解包副本。
  - '**/node_modules/@esbuild/**'
  # TypeScript language server is launched via ELECTRON_RUN_AS_NODE + cli.mjs.
  # Unpack so the main process can open the CLI (and its typescript dependency)
  # from a real path, not only from inside app.asar.
  - '**/node_modules/typescript-language-server/**'
  - '**/node_modules/typescript/**'

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  extraResources:
    - from: native/lsp-windows-job/artifacts/${arch}/Release/lsp_windows_job.node
      to: lsp-windows-job/${arch}/lsp_windows_job.node

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  forceCodeSigning: true
  gatekeeperAssess: false
  notarize: true

publish:
  provider: github
  owner: runloom
  repo: pier
  releaseType: release

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
