appId: io.pier.app
productName: Pier
copyright: Copyright © 2026 Pier

directories:
  output: dist-builder
  buildResources: build

# Runs before code signing and gives every production Helper the same ICNS as
# Pier. Only the main app carries the macOS native Assets.car rendition.
afterPack: ./scripts/mac-helper-icons.mjs

# Native terminal runtime:
# - terminal.ts 用 require("../../native/build/Release/ghostty_native.node")
# - terminal-native-addon.ts 把 GHOSTTY_RESOURCES_DIR 指向
#   native/GhosttyResources/ghostty
# 必须把 .node/.dylib 和 Ghostty resources 都打进包，且 asarUnpack 保留物理路径。
files:
  - out/**/*
  - '!**/*.map'
  - native/build/Release/**
  - native/GhosttyResources/**

extraResources:
  - from: bin/pier.mjs
    to: bin/pier.mjs
  - from: bin/pier-cli-parser.js
    to: bin/pier-cli-parser.js
  - from: bin/pier-cli-path.js
    to: bin/pier-cli-path.js
  - from: bin/pier-cli-launch.js
    to: bin/pier-cli-launch.js
  - from: bin/pier-cli-human.js
    to: bin/pier-cli-human.js
  - from: bin/pier-control-client.js
    to: bin/pier-control-client.js
  - from: bin/pier-app.sh
    to: bin/pier
  - from: resources/fonts
    to: fonts
  - from: resources/notification-sounds
    to: notification-sounds
  - from: resources/system-skills
    to: system-skills
    filter:
      - "**/*"
  # 项目记忆 MCP 启动器(安装到 ~/.pier/memory/launcher,见 v3 spec)
  - from: resources/memory-launcher
    to: memory-launcher
  # Content search runtime (rg). Layout: search/<arch>/rg
  - from: resources/search
    to: search
    filter:
      - "**/*"
      - "!README.md"
  - from: packages/plugin-codex/dist-pkg
    to: plugin-packages/pier.codex
    filter:
      - '*.tgz'
      - '*.tgz.sha256'
      - 'plugin.json'
  - from: packages/plugin-grok/dist-pkg
    to: plugin-packages/pier.grok
    filter:
      - '*.tgz'
      - '*.tgz.sha256'
      - 'plugin.json'
  - from: packages/plugin-ssh/dist-pkg
    to: plugin-packages/pier.ssh
    filter:
      - '*.tgz'
      - '*.tgz.sha256'
      - 'plugin.json'
  - from: packages/plugin-agent-splits/dist-pkg
    to: plugin-packages/pier.agent-splits
    filter:
      - '*.tgz'
      - '*.tgz.sha256'
      - 'plugin.json'
  - from: packages/plugin-claude/dist-pkg
    to: plugin-packages/pier.claude
    filter:
      - '*.tgz'
      - '*.tgz.sha256'
      - 'plugin.json'

asar: true
asarUnpack:
  - native/build/Release/**
  - native/GhosttyResources/**
  # 画布编译走 esbuild，它 spawn 一个原生二进制。asar 是单个文件，spawn 会
  # ENOTDIR；main 侧 ensureEsbuildBinaryPath() 把路径改写到这里的解包副本。
  - '**/node_modules/@esbuild/**'
  # TypeScript language server is launched via ELECTRON_RUN_AS_NODE + cli.mjs.
  # Unpack so the main process can open the CLI (and its typescript dependency)
  # from a real path, not only from inside app.asar.
  - '**/node_modules/typescript-language-server/**'
  - '**/node_modules/typescript/**'
  # Canvas Tailwind JIT loads @tailwindcss/oxide (and lightningcss via
  # @tailwindcss/node). Native .node files must be real paths, not asar.
  - '**/node_modules/@tailwindcss/oxide/**'
  - '**/node_modules/@tailwindcss/oxide-*/**'
  - '**/node_modules/@tailwindcss/node/**'
  - '**/node_modules/lightningcss/**'
  - '**/node_modules/lightningcss-*/**'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
  extraResources:
    - from: native/lsp-windows-job/artifacts/${arch}/Release/lsp_windows_job.node
      to: lsp-windows-job/${arch}/lsp_windows_job.node

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Release only: actool compiles a temporary one-PNG Icon Composer document
  # from the 1024px ICNS frame generated from build/app-icon-source.svg.
  # CFBundleIconName + Assets.car provide the macOS 26 native route;
  # icon.icns stays the older-macOS fallback. PierDev is deliberately
  # ICNS-only and removes both CFBundleIconName and Assets.car.
  extendInfo:
    CFBundleIconName: app-icon
    # TCC 弹窗英文回退；简体中文见 extraResources 的 lproj。来源 scripts/mac-privacy-descriptions.mjs。
    NSAppleEventsUsageDescription: "Pier needs to control other apps with Apple Events so scripts and commands you run in its terminal (like osascript) work as expected."
    NSDesktopFolderUsageDescription: "Pier needs access to your Desktop folder so its terminal and file panels can open projects stored there."
    NSDocumentsFolderUsageDescription: "Pier needs access to your Documents folder so its terminal and file panels can open projects stored there."
    NSDownloadsFolderUsageDescription: "Pier needs access to your Downloads folder so its terminal and file panels can open projects stored there."
    NSFileProviderDomainUsageDescription: "Pier needs access to files managed by iCloud Drive or other sync providers so it can open projects stored in those locations."
    NSNetworkVolumesUsageDescription: "Pier needs access to files on network volumes so it can open projects stored there."
    NSRemovableVolumesUsageDescription: "Pier needs access to files on removable volumes so it can open projects stored there."
  extraResources:
    - from: build/Assets.car
      to: Assets.car
    # 简体中文本地化（zh_CN 因 Electron 空目录必须双写）
    - from: build/zh-Hans.lproj/InfoPlist.strings
      to: zh-Hans.lproj/InfoPlist.strings
    - from: build/zh_CN.lproj/InfoPlist.strings
      to: zh_CN.lproj/InfoPlist.strings
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  forceCodeSigning: true
  gatekeeperAssess: false
  notarize: true

linux:
  icon: build/icons

publish:
  provider: github
  owner: runloom
  repo: pier
  releaseType: release

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
