  </defs>
  <rect id="pier-body" x="102" y="102" width="820" height="820" rx="164" fill="url(#pier-body-fill)"/>
  <g clip-path="url(#pier-body-clip)">
    <g transform="translate(102 102) scale(0.80078125)">
      <g id="pier-berth-relief" filter="url(#pier-relief)">
