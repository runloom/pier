        <rect id="pier-berth-seam-guard" x="0" y="1008" width="1024" height="64" fill="url(#pier-violet)"/>
      </g>
      <g clip-path="url(#pier-berth-clip)">
        <rect id="pier-ping-left" x="0" y="640" width="380" height="280" fill="url(#pier-ping-left)"/>
        <rect id="pier-ping-right" x="644" y="640" width="380" height="280" fill="url(#pier-ping-right)"/>
        <path id="pier-berth-rim" d="M88 682 C186 682 196 868 328 868 H696 C828 868 838 682 936 682" fill="none" stroke="url(#pier-rim)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="pier-prompt" transform="translate(512 440) scale(0.86) translate(-547.5 -411.5)">
        <path id="pier-chevron" d="M337 223 L522 405 L337 599" fill="none" stroke="#ffffff" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="pier-underscore" d="M547 612 H770" fill="none" stroke="#ffffff" stroke-width="80" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  <rect id="pier-edge-rim" x="102" y="102" width="820" height="820" rx="164" fill="none" stroke="url(#pier-edge)" stroke-width="14" clip-path="url(#pier-body-clip)"/>
</svg>
