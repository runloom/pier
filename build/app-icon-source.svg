    <clipPath id="pier-body-clip">
      <rect x="102" y="102" width="820" height="820" rx="164"/>
    </clipPath>
    <clipPath id="pier-berth-clip">
      <path d="M0 664 H64 C176 664 180 850 320 850 H704 C844 850 848 664 960 664 H1024 V1024 H0 Z"/>
