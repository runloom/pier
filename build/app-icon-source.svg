<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Pier app icon</title>
  <defs>
    <linearGradient id="pier-body-fill" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="46%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0c1016"/>
    </linearGradient>
    <linearGradient id="pier-violet" x1="0" y1="664" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b66cff"/>
      <stop offset="46%" stop-color="#8549ff"/>
      <stop offset="100%" stop-color="#542ee5"/>
    </linearGradient>
    <radialGradient id="pier-ping-left" cx="160" cy="720" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.70"/>
      <stop offset="35%" stop-color="#f0e4ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pier-ping-right" cx="864" cy="720" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.70"/>
      <stop offset="35%" stop-color="#f0e4ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pier-rim" x1="64" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="18%" stop-color="#efe4ff" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#cbb6ff" stop-opacity="0.05"/>
      <stop offset="82%" stop-color="#efe4ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="pier-relief" x="-16" y="-16" width="1056" height="1056" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="0" dy="6" result="top-shift"/>
      <feComposite in="SourceAlpha" in2="top-shift" operator="out" result="top-band"/>
      <feGaussianBlur in="top-band" stdDeviation="1.25" result="top-soft"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.28" result="top-color"/>
      <feComposite in="top-color" in2="top-soft" operator="in" result="top-tint"/>
      <feComposite in="top-tint" in2="SourceAlpha" operator="in" result="top-highlight"/>
      <feOffset in="SourceAlpha" dx="0" dy="-8" result="bottom-shift"/>
      <feComposite in="SourceAlpha" in2="bottom-shift" operator="out" result="bottom-band"/>
      <feGaussianBlur in="bottom-band" stdDeviation="1.75" result="bottom-soft"/>
      <feFlood flood-color="#07111f" flood-opacity="0.34" result="bottom-color"/>
      <feComposite in="bottom-color" in2="bottom-soft" operator="in" result="bottom-tint"/>
      <feComposite in="bottom-tint" in2="SourceAlpha" operator="in" result="bottom-shadow"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="top-highlight"/>
        <feMergeNode in="bottom-shadow"/>
      </feMerge>
    </filter>
    <linearGradient id="pier-edge" x1="102" y1="102" x2="102" y2="922" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
