<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pier 应用图标</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
          sans-serif;
        --bg: #070b15;
        --panel: #0c1120;
        --line: rgba(210, 222, 255, 0.09);
        --fg: #e9edf6;
        --muted: #a2acc2;
        --faint: #69748f;
        --brand: #8549ff;
        --brand-hi: #b66cff;
        --brand-deep: #542ee5;
        --dock: #c8c8c8;
        --day: #f6f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(42% 50% at 50% 0%, rgba(133, 73, 255, 0.18), transparent 70%),
          var(--bg);
        color: var(--fg);
      }

      main {
        width: min(1040px, calc(100% - 40px));
        margin: 0 auto;
        padding: 48px 0 80px;
      }

      header {
        max-width: 720px;
        margin-bottom: 36px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(28px, 4.4vw, 46px);
        letter-spacing: -0.04em;
      }

      h2 {
        font-size: 13px;
        color: var(--faint);
        font-weight: 650;
      }

      .lead {
        margin-top: 14px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      section {
        margin-top: 42px;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .section-head p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .card {
        border: 1px solid var(--line);
        background: color-mix(in oklab, var(--panel) 88%, transparent);
        border-radius: 22px;
        overflow: hidden;
      }

      .stage {
        display: grid;
        place-items: center;
        aspect-ratio: 1;
        background: var(--dock);
      }

      .stage img {
        display: block;
        width: 78%;
        height: 78%;
      }

      .stage-night {
        background: #04060d;
      }

      .stage-day {
        background: var(--day);
      }

      .caption {
        padding: 14px 16px 16px;
      }

      .caption strong {
        display: block;
        font-size: 14px;
        font-weight: 650;
      }

      .caption span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .hero-row {
        display: grid;
        grid-template-columns: minmax(240px, 420px) 1fr;
        gap: 16px;
        align-items: stretch;
      }

      .contexts {
        display: grid;
        gap: 16px;
      }

      .strip {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 22px;
        padding: 18px 20px;
        border: 1px solid var(--line);
        border-radius: 18px;
        margin-top: 12px;
      }

      .strip figure {
        margin: 0;
        display: grid;
        justify-items: center;
        gap: 8px;
      }

      .strip img {
        display: block;
      }

      .strip figcaption {
        color: var(--faint);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .px-16 { width: 16px; height: 16px; }
      .px-32 { width: 32px; height: 32px; }
      .px-48 { width: 48px; height: 48px; }
      .px-64 { width: 64px; height: 64px; }
      .px-128 { width: 128px; height: 128px; }

      .bg-dock { background: var(--dock); }
      .bg-night { background: #04060d; }
      .bg-day { background: var(--day); }

      .site-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 56px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in oklab, #070b15 82%, transparent);
      }

      .site-bar img {
        width: 36px;
        height: 36px;
        display: block;
      }

      .wordmark {
        font-weight: 700;
        letter-spacing: 0.16em;
        font-size: 15px;
      }

      .cta {
        margin-left: auto;
        color: #fff;
        background: linear-gradient(135deg, var(--brand-hi), var(--brand) 55%, var(--brand-deep));
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
      }

      @media (max-width: 860px) {
        main {
          width: min(100% - 24px, 640px);
          padding-top: 28px;
        }

        .grid-2,
        .hero-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Pier 应用图标</h1>
        <p class="lead">
          白 <code>&gt;_</code> 作为一组，在泊位上方的暗面里水平、垂直都居中。
        </p>
      </header>

      <section aria-labelledby="hero-heading">
        <div class="section-head">
          <h2 id="hero-heading">正式发布稿</h2>
          <p>由 <code>build/app-icon-source.svg</code> 生成的 512px PNG。</p>
        </div>
        <div class="hero-row">
          <article class="card">
            <div class="stage">
              <img src="../icons/512x512.png" alt="Pier 应用图标" />
            </div>
          </article>
          <div class="contexts">
            <article class="card">
              <div class="site-bar">
                <img src="../icons/512x512.png" alt="" />
                <span class="wordmark">PIER</span>
                <span class="cta">下载</span>
              </div>
              <div class="caption">
                <strong>页头 36px</strong>
                <span>白提示符，金属泊位。</span>
              </div>
            </article>
            <div class="grid-2">
              <div class="card">
                <div class="stage stage-night">
                  <img src="../icons/512x512.png" alt="" />
                </div>
              </div>
              <div class="card">
                <div class="stage stage-day">
                  <img src="../icons/512x512.png" alt="" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section aria-labelledby="before-heading">
        <div class="section-head">
          <h2 id="before-heading">改前对照</h2>
          <p>左为拆开的提示符，右为整体居中的正式稿。</p>
        </div>
        <div class="grid-2">
          <article class="card">
            <div class="stage">
              <img src="./previous-shipping.png" alt="改前：哑光" />
            </div>
            <div class="caption">
              <strong>改前</strong>
              <span><code>&gt;</code> 和 <code>_</code> 拆开、不居中。</span>
            </div>
          </article>
          <article class="card">
            <div class="stage">
              <img src="../icons/512x512.png" alt="改后：金属高光" />
            </div>
            <div class="caption">
              <strong>现在</strong>
              <span><code>&gt;_</code> 作为一组居中，停在泊位上方。</span>
            </div>
          </article>
        </div>
      </section>

      <section aria-labelledby="size-heading">
        <div class="section-head">
          <h2 id="size-heading">16–128px</h2>
          <p>同一份稿直接缩小。</p>
        </div>
        <div class="strip bg-dock">
          <figure>
            <img class="px-16" src="../icons/512x512.png" alt="" />
            <figcaption>16</figcaption>
          </figure>
          <figure>
            <img class="px-32" src="../icons/512x512.png" alt="" />
            <figcaption>32</figcaption>
          </figure>
          <figure>
            <img class="px-48" src="../icons/512x512.png" alt="" />
            <figcaption>48</figcaption>
          </figure>
          <figure>
            <img class="px-64" src="../icons/512x512.png" alt="" />
            <figcaption>64</figcaption>
          </figure>
          <figure>
            <img class="px-128" src="../icons/512x512.png" alt="" />
            <figcaption>128</figcaption>
          </figure>
        </div>
        <div class="strip bg-night">
          <figure>
            <img class="px-32" src="../icons/512x512.png" alt="" />
            <figcaption>32</figcaption>
          </figure>
          <figure>
            <img class="px-64" src="../icons/512x512.png" alt="" />
            <figcaption>64</figcaption>
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
