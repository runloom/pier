<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 170" width="210" height="170" role="img" aria-label="Pier docked terminal mark">
  <defs>
    <linearGradient id="berth-fill" x1="0.16" y1="0.02" x2="0.82" y2="1">
      <stop offset="0" stop-color="#b66cff"/>
      <stop offset="0.44" stop-color="#8549ff"/>
      <stop offset="1" stop-color="#542ee5"/>
    </linearGradient>
    <linearGradient id="berth-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b275ff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#5b35ec" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2811b8" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="berth-top-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#eadfff" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#b89aff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="berth-shelf" x1="0" y1="108" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8d72d8" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#8f76dd" stop-opacity="0.28"/>
      <stop offset="0.38" stop-color="#a58df8" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#b6a3fe" stop-opacity="0.82"/>
      <stop offset="0.72" stop-color="#cbbcfb" stop-opacity="0.92"/>
      <stop offset="0.86" stop-color="#ded0ff" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#6b54db" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="terminal-frame-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a56ff2"/>
      <stop offset="0.04" stop-color="#a56ff2"/>
      <stop offset="0.15" stop-color="#a565ef"/>
      <stop offset="0.5" stop-color="#7041e4"/>
      <stop offset="1" stop-color="#5f92f6"/>
    </linearGradient>
    <linearGradient id="terminal-top-rim" x1="50" y1="19" x2="160" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3e6ff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#fff8ff" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#eadcfb" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#c5a9ef" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="terminal-lower-rim" x1="0" y1="80" x2="0" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b8cff" stop-opacity="0.04"/>
      <stop offset="0.42" stop-color="#779cf5" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#81aaf7" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="screen-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040b18"/>
      <stop offset="0.65" stop-color="#020812"/>
      <stop offset="1" stop-color="#02050f"/>
    </linearGradient>
    <radialGradient id="screen-glow" cx="0.12" cy="0.14" r="0.41">
      <stop offset="0" stop-color="#765ed3" stop-opacity="0.47"/>
      <stop offset="0.28" stop-color="#3b397b" stop-opacity="0.11"/>
      <stop offset="0.75" stop-color="#0a1020" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen-left-depth" x1="54" y1="32" x2="56" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5d46bd" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#271d69" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#24408b" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="screen-right-depth" x1="153" y1="32" x2="155" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7857dc" stop-opacity="0.16"/>
      <stop offset="0.62" stop-color="#493b9d" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#4271c8" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="glyph-fill" x1="0" y1="45" x2="0" y2="77" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#eef0f5"/>
      <stop offset="1" stop-color="#b9bec9"/>
    </linearGradient>
    <filter id="berth-shadow" x="-15%" y="-10%" width="130%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#15064c" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="0.7" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="terminal-shadow-and-halo" x="35" y="6" width="140" height="112" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="halo-blur"/>
      <feOffset in="halo-blur" dx="-0.55" dy="1.1" result="halo-position"/>
      <feFlood flood-color="#7552ff" flood-opacity="0.18" result="halo-color"/>
      <feComposite in="halo-color" in2="halo-position" operator="in" result="uniform-halo"/>
    </filter>
    <filter id="terminal-bottom-shadow" x="42" y="88" width="125" height="25" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3 1.8" result="shadow-blur"/>
      <feOffset in="shadow-blur" dy="1.5" result="shadow-position"/>
      <feFlood flood-color="#010612" flood-opacity="0.36" result="shadow-color"/>
      <feComposite in="shadow-color" in2="shadow-position" operator="in"/>
    </filter>
    <filter id="glyph-shadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.3" stdDeviation="0.9" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <clipPath id="berth-clip">
      <path d="M22 60H32c4 0 7 3 7 7v32c0 7 6 13 13 13h104c7 0 13-6 13-13V67c0-4 3-7 7-7h11c4 0 7 3 7 7v40c-2.4 16-17.6 29-40 29H54c-20.6 0-38.5-13-39-29V67c0-4 3-7 7-7Z"/>
    </clipPath>
  </defs>

  <g id="berth-layer" transform="translate(104.5 145) scale(0.9) translate(-104.5 -145)">
    <g id="berth-body" filter="url(#berth-shadow)">
      <path id="berth-base" d="M22 60H32c4 0 7 3 7 7v32c0 7 6 13 13 13h104c7 0 13-6 13-13V67c0-4 3-7 7-7h11c4 0 7 3 7 7v40c-2.4 16-17.6 29-40 29H54c-20.6 0-38.5-13-39-29V67c0-4 3-7 7-7Z" fill="url(#berth-fill)"/>
      <rect id="berth-depth-overlay" x="15" y="60" width="179" height="76" fill="url(#berth-depth)" clip-path="url(#berth-clip)"/>
      <path id="berth-arm-highlights" d="M22 61H32c3 0 5 2 5 5M171 66c0-3 2-5 5-5h11" fill="none" stroke="url(#berth-top-rim)" stroke-width="1.5" stroke-linecap="butt" opacity="0.72"/>
      <path id="berth-inner-shelf" d="M34 98C34 95.7 36.2 94 39 94s5 1.7 5 4v1c0 6.1 4.9 11 11 11h99c5.5 0 10-4.5 10-10v-2c0-2.3 2.2-4 5-4s5 1.7 5 4v2c0 11.1-8.9 20-20 20H55c-11.6 0-21-9.4-21-21Z" fill="url(#berth-shelf)"/>
    </g>
  </g>

  <g id="terminal-layer" transform="translate(104.5 102) scale(0.9042 1.0127) translate(-104.5 -102)">
    <g id="terminal-material-effects">
      <rect id="terminal-bottom-shadow-shape" x="51" y="94" width="107" height="8" rx="4" fill="#000000" filter="url(#terminal-bottom-shadow)"/>
      <rect id="terminal-effect-shape" x="47" y="18" width="115" height="84" rx="15" fill="#000000" filter="url(#terminal-shadow-and-halo)"/>
    </g>
    <rect id="terminal-frame" x="47" y="18" width="115" height="84" rx="15" fill="url(#terminal-frame-fill)"/>
    <g id="screen-layer">
      <rect id="screen" x="54" y="24" width="101" height="72" rx="10" fill="url(#screen-fill)"/>
      <rect id="screen-left-top-glow" x="54" y="24" width="101" height="72" rx="10" fill="url(#screen-glow)"/>
      <path id="screen-left-inner-depth" d="M54 34C54 29.6 56.1 26.7 59.1 25.3L60.4 25.1C57.4 27.2 55.6 30.1 55.6 34v52c0 3.7 1.4 6.4 4.1 8.5l-1.4-.2C55.6 92.8 54 90 54 86Z" fill="url(#screen-left-depth)"/>
      <path id="screen-right-inner-depth" d="M149 25.2C152.7 27.1 155 30.2 155 34v52c0 3.8-2.1 6.9-5.4 8.7l-1.5.2c3.3-2.2 5.2-5.1 5.2-8.9V34c0-3.6-1.7-6.4-4.7-8.6Z" fill="url(#screen-right-depth)"/>
    </g>
    <g id="terminal-frame-highlights">
      <path id="terminal-top-highlight" d="M61.5 19.2H148c5.2 0 9.4 2.5 11.6 6.4l-1.7.9c-2-3.6-5.2-5.8-9.9-5.8H61.5c-4.4 0-7.7 1.8-9.8 4.9l-1.5-.8c2.3-3.6 6.2-5.6 11.3-5.6Z" fill="url(#terminal-top-rim)"/>
      <path id="terminal-bottom-highlight" d="M50 80v4c0 8.1 6.2 14 14 14h81c7.8 0 14-5.9 14-14v-4h-1.8v4c0 7-5.3 12-12.2 12H64c-6.9 0-12.2-5-12.2-12v-4Z" fill="url(#terminal-lower-rim)"/>
    </g>
    <g id="glyph-layer" filter="url(#glyph-shadow)" fill="none" stroke="url(#glyph-fill)" stroke-linecap="round" stroke-linejoin="round">
      <path id="chevron" d="M73.8 47.6L88.4 59L73.8 70.4" stroke-width="4.95"/>
      <path id="underscore" d="M94.8 74.4H110.2" stroke-width="5.5"/>
    </g>
  </g>
</svg>
