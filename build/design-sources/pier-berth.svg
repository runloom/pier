<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pier app icon — minimal docked terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1824"/>
      <stop offset="1" stop-color="#09080d"/>
    </linearGradient>
    <linearGradient id="dock" x1="0.18" y1="0.04" x2="0.82" y2="1">
      <stop offset="0" stop-color="#c5b5ff"/>
      <stop offset="0.48" stop-color="#9675ff"/>
      <stop offset="1" stop-color="#6547db"/>
    </linearGradient>
    <linearGradient id="windowStroke" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#e0d8ff"/>
      <stop offset="0.52" stop-color="#a889ff"/>
      <stop offset="1" stop-color="#7354e8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.08" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="innerShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.76" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.26"/>
    </linearGradient>
    <clipPath id="plate"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#plate)">
    <rect width="512" height="512" fill="url(#rim)"/>
    <rect width="512" height="512" fill="url(#innerShade)"/>
  </g>
  <!-- One continuous berth represents Pier's persistent workspace. -->
  <path d="M 119 247 V 340 C 119 383 153 417 196 417 H 316 C 359 417 393 383 393 340 V 247"
    fill="none" stroke="url(#dock)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The native terminal session is visibly docked inside that berth. -->
  <rect x="132" y="104" width="248" height="218" rx="48" fill="#0f0e15" stroke="url(#windowStroke)" stroke-width="22"/>
  <path d="M 189 169 L 232 211 L 189 253" fill="none" stroke="#f6f3ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 255 252 H 309" fill="none" stroke="#f6f3ff" stroke-width="22" stroke-linecap="round"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
</svg>
