packages:
  - .
  - packages/*
  - apps/*
allowBuilds:
  electron-winstaller: true
  esbuild: true
peerDependencyRules:
  allowedVersions:
    "electron-vite>vite": "8"
patchedDependencies:
  '@pierre/diffs@1.2.12': patches/@pierre__diffs@1.2.12.patch
  "@pierre/trees@1.0.0-beta.5": patches/@pierre__trees@1.0.0-beta.5.patch
  '@replit/codemirror-minimap@0.5.2': patches/@replit__codemirror-minimap@0.5.2.patch
  dockview-core@7.0.2: patches/dockview-core@7.0.2.patch
# Dual-arch mac pack: install Intel + Apple Silicon optional natives on one host
# so electron-builder can copy darwin-x64 / darwin-arm64 into the matching app.
supportedArchitectures:
  cpu:
    - current
    - arm64
    - x64
  os:
    - current
